<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Seznam vánočních přání Anežky a Filipa 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a wrapped-paper band on top, then one column of paper gift tags tied to the list. */
:root {
  --bg: #F4EEF4; --paper: #FFFDFC; --ink: #2A1A33; --muted: #685770; --line: #DDCFE0;
  --berry: #A81F57; --on-berry: #FFFFFF; --gold: #E5AE3C; --on-gold: #33230A;
  --band: #8E1A4B; --band-2: #9D2558; --on-band: #FFF6F0;
  --ok-bg: #E4F1E6; --ok-ink: #1F5B31; --warn-bg: #FBEFD3; --warn-ink: #6A4A07;
  --shadow: rgba(66, 28, 70, .16); --photo: #FFFFFF;
  --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body: "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --gold-shade: #C98F26; --gold-light: #F4CE74; --gold-deep: #A9761A; --puff-1: #FFFFFF; --puff-2: #D8C9E0;
  --ribbon-right: clamp(28px, calc(21vw - 60px), 200px);
  --bow-w: clamp(72px, 14vw, 140px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1F1725; --paper: #2E2436; --ink: #F3EAF1; --muted: #BBABC1; --line: #4A3C54;
    --berry: #F2779F; --on-berry: #2A0F1C; --gold: #E5AE3C; --on-gold: #33230A;
    --band: #5C1536; --band-2: #691B3F; --on-band: #FFF0EA;
    --ok-bg: #203A29; --ok-ink: #B5E3C2; --warn-bg: #43361A; --warn-ink: #F3D993;
    --shadow: rgba(0, 0, 0, .4); --photo: #FFFFFF;
    --puff-1: #9C8CA6; --puff-2: #5E4F69;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1F1725; --paper: #2E2436; --ink: #F3EAF1; --muted: #BBABC1; --line: #4A3C54;
  --berry: #F2779F; --on-berry: #2A0F1C; --gold: #E5AE3C; --on-gold: #33230A;
  --band: #5C1536; --band-2: #691B3F; --on-band: #FFF0EA;
  --ok-bg: #203A29; --ok-ink: #B5E3C2; --warn-bg: #43361A; --warn-ink: #F3D993;
  --shadow: rgba(0, 0, 0, .4); --photo: #FFFFFF;
  --puff-1: #9C8CA6; --puff-2: #5E4F69;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
  font: 400 1rem/1.5 var(--body); padding-bottom: env(safe-area-inset-bottom, 0px);
}
button, input, select { font: inherit; color: inherit; }
a { color: var(--berry); }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

.wrap {
  width: 100%; max-width: 860px; margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Wrapped-paper header */
.band {
  position: relative; overflow: hidden; color: var(--on-band);
  background: repeating-linear-gradient(135deg, var(--band) 0 16px, var(--band-2) 16px 32px);
  border-bottom: 7px solid var(--gold);
}
.bandwrap { position: relative; z-index: 5; }
.band::after {
  content: ""; position: absolute; top: 0; bottom: 0; right: var(--ribbon-right);
  width: 20px; background: var(--gold);
}
.band .wrap { position: relative; z-index: 1; padding-block: 34px 30px; }
h1 { font: 700 min(3.4rem, max(min(6.5vw, 1.55rem), 5.2vw))/1.08 var(--display); letter-spacing: -.02em; margin: 0 0 10px; }
.title-line { display: block; }
.lede { margin: 0; max-width: min(34em, calc(100% - var(--ribbon-right) - var(--bow-w) / 2 + 6px)); }

/* The bow sits on the point where the two ribbons cross. Its tails hang over the page. */
.bow {
  position: absolute; display: block; width: var(--bow-w); aspect-ratio: 200 / 180; pointer-events: none;
  top: calc(100% - var(--bow-w) * .45 - 3px); right: calc(var(--ribbon-right) + 10px - var(--bow-w) / 2);
  filter: drop-shadow(0 3px 4px var(--shadow));
}
.bow-gold { fill: var(--gold); }
.bow-shade { fill: var(--gold-shade); }
.bow-light { fill: var(--gold-light); }
.bow-deep { fill: var(--gold-deep); }
main.wrap { padding-top: calc(var(--bow-w) * .45 - 12px); }

/* Notices and owner bar */
.notice {
  margin-top: 16px; padding: 10px 14px; border-radius: 8px;
  background: var(--warn-bg); color: var(--warn-ink); font-size: .9375rem;
}
.ownerbar {
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between;
  margin-top: 20px;
}
.tabs { display: flex; gap: 4px; padding: 4px; background: var(--paper); border-radius: 10px; border: 1px solid var(--line); }
.tabs button {
  border: 0; background: transparent; padding: 7px 12px; border-radius: 7px; font-weight: 600;
  color: var(--muted); cursor: pointer; font-variant-numeric: tabular-nums;
}
.tabs button[aria-selected="true"] { background: var(--berry); color: var(--on-berry); }

/* Sorting and filters */
.filters {
  margin-top: 20px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--paper); display: grid; grid-template-columns: 1.3fr 1.3fr 1fr 1fr; gap: 12px;
}
.filters .field { min-width: 0; }
.filters-foot {
  grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; justify-content: space-between;
  color: var(--muted); font-variant-numeric: tabular-nums;
}
.filters-foot .btn { margin-right: -10px; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 42px; padding: 8px 16px; border-radius: 9px; border: 1px solid var(--line);
  background: var(--paper); font-weight: 600; cursor: pointer; text-decoration: none; color: var(--ink);
}
.btn:hover { border-color: var(--berry); }
.btn.primary { background: var(--berry); border-color: var(--berry); color: var(--on-berry); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.quiet { background: transparent; border-color: transparent; color: var(--muted); padding-inline: 10px; min-height: 36px; font-weight: 500; }
.btn.quiet:hover { color: var(--berry); }
.btn[disabled] { opacity: .6; cursor: progress; }

/* Gift tags */
.giftlist { list-style: none; margin: 22px 0 0; padding: 0; display: grid; gap: 16px; }
.item { filter: drop-shadow(0 3px 7px var(--shadow)); min-width: 0; }
.tag {
  position: relative; background: var(--paper); padding: 16px 16px 14px 48px;
  clip-path: polygon(24px 0, 100% 0, 100% 100%, 24px 100%, 0 calc(100% - 24px), 0 24px);
  display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 10px 16px; align-items: start;
}
.thumb {
  display: block; position: relative; overflow: hidden; width: 112px; aspect-ratio: 1; max-width: 100%;
  border-radius: 8px; background: var(--photo); grid-row: span 2;
}
.thumb img { display: block; width: 100%; height: 100%; object-fit: contain; }
.thumb.empty { background: repeating-linear-gradient(135deg, var(--band) 0 8px, var(--band-2) 8px 16px); }
.thumb.empty::before, .thumb.empty::after { content: ""; position: absolute; background: var(--gold); }
.thumb.empty::before { left: 50%; top: 0; bottom: 0; width: 10px; margin-left: -5px; }
.thumb.empty::after { top: 50%; left: 0; right: 0; height: 10px; margin-top: -5px; }
.thumb-bow { position: absolute; left: 50%; top: 50%; width: 68%; aspect-ratio: 200 / 180; transform: translate(-50%, -50%); }
.tag-main { min-width: 0; display: grid; gap: 8px; }
.tag::before {
  content: ""; position: absolute; left: 16px; top: 50%; width: 14px; height: 14px; margin-top: -7px;
  border-radius: 50%; background: var(--bg); box-shadow: inset 0 0 0 2px var(--gold);
}
.tag-head { display: flex; gap: 12px; justify-content: space-between; align-items: flex-start; }
.tag-title { min-width: 0; }
h2 { font: 700 1.3rem/1.2 var(--display); margin: 0; overflow-wrap: anywhere; }
.anykind { margin: 4px 0 0; color: var(--muted); font-size: .9375rem; }
.price { font: 700 1.1rem/1.3 var(--display); white-space: nowrap; font-variant-numeric: tabular-nums; }
.options { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
.options b { font-weight: 600; color: var(--muted); }
.actions { grid-column: 2; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.shop { font-weight: 600; margin-right: auto; overflow-wrap: anywhere; }
.tick { padding-left: 11px; margin-left: auto; }
.joy-actions { gap: 8px 16px; }
.joy-actions .tick { margin-left: 0; }
.stepper {
  display: inline-flex; align-items: center; flex: none; margin-left: auto; overflow: hidden;
  min-height: 42px; border: 1px solid var(--line); border-radius: 9px; background: var(--paper);
}
.stepper button {
  width: 36px; height: 40px; padding: 0; border: 0; background: transparent; cursor: pointer;
  font-size: 1.3rem; line-height: 1; font-weight: 600; color: var(--ink);
}
.stepper button:hover:not([disabled]) { color: var(--berry); background: var(--bg); }
.stepper button[disabled] { opacity: .35; cursor: default; }
.stepper button:focus-visible { outline-offset: -3px; }
.qty-value { min-width: 28px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
.undo {
  justify-self: start; padding: 0; border: 0; background: none; cursor: pointer;
  color: var(--muted); font-size: .875rem; text-decoration: underline;
}
.undo:hover { color: var(--berry); }
.tick::before {
  content: ""; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--berry); flex: none;
}
.owner-actions { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 2px; margin-left: -10px; border-top: 1px dashed var(--line); padding-top: 6px; }
.stamp {
  justify-self: start; padding: 2px 10px; border-radius: 5px; font-weight: 600; font-size: .875rem;
  background: var(--ok-bg); color: var(--ok-ink); font-variant-numeric: tabular-nums;
}
.status { margin-top: 28px; text-align: center; color: var(--muted); }
.status h2 { color: var(--ink); margin-bottom: 4px; }
.status .btn { margin-top: 12px; }

.joys { margin-top: 40px; padding-top: 22px; border-top: 2px dashed var(--line); }
.joys-head { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.joys-head h2 { font-size: 1.7rem; }
.joys-lede { margin: 6px 0 0; color: var(--muted); max-width: 40em; }

footer { margin-top: 36px; padding-block: 8px 28px; text-align: center; }

/* Dialogs */
dialog {
  width: min(460px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); overflow-y: auto;
  border: 0; border-radius: 14px; padding: 20px; background: var(--paper); color: var(--ink);
  box-shadow: 0 18px 50px var(--shadow);
}
dialog::backdrop { background: rgba(30, 14, 34, .55); }
dialog h2 { margin-bottom: 8px; }
dialog p { margin: 0 0 12px; }
.named { font-weight: 600; overflow-wrap: anywhere; }
form { display: grid; gap: 14px; }
.field { display: grid; gap: 4px; }
.field label { font-weight: 600; font-size: .9375rem; }
.field small { color: var(--muted); }
input[type="text"], input[type="password"], select {
  width: 100%; min-height: 44px; padding: 9px 12px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--bg);
}
.switch { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; font-weight: 600; }
.switch input { position: absolute; opacity: 0; }
.switch .track {
  flex: none; width: 44px; height: 26px; border-radius: 13px; background: var(--line);
  position: relative; transition: background .15s;
}
.switch .track::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px;
  border-radius: 50%; background: var(--paper); transition: transform .15s;
}
.switch input:checked + .track { background: var(--berry); }
.switch input:checked + .track::after { transform: translateX(18px); }
.switch input:focus-visible + .track { outline: 3px solid var(--gold); outline-offset: 2px; }
.switch small { display: block; font-weight: 400; color: var(--muted); }
.imgrow { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 12px; align-items: start; }
.imgrow .thumb { width: 76px; grid-row: auto; }
.imgside { display: grid; gap: 6px; min-width: 0; }
.imgside small { color: var(--muted); }
.imgside .btn { justify-self: start; margin-left: -10px; }
#fDetails { display: grid; gap: 14px; padding-left: 14px; border-left: 3px solid var(--gold); }
.dlg-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 6px; }
.error { margin: 0; color: var(--berry); font-weight: 600; }

#toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  width: max-content; max-width: calc(100vw - 32px); z-index: 20;
  padding: 10px 16px; border-radius: 9px; background: var(--ink); color: var(--bg); font-weight: 500;
}
/* Gift wrapping when something is bought */
.fx-layer { position: fixed; inset: 0; z-index: 30; overflow: hidden; pointer-events: none; }
.fx-box { position: absolute; }
.fx-paper { background: repeating-linear-gradient(135deg, var(--band) 0 16px, var(--band-2) 16px 32px); }
.fx-flap { position: absolute; left: 0; right: 0; height: 53%; opacity: 0; box-shadow: 0 0 9px var(--shadow); }
.fx-flap.top { top: 0; transform-origin: top; }
.fx-flap.bottom { bottom: 0; transform-origin: bottom; }
.fx-rib { position: absolute; background: var(--gold); transform: scale(0); }
.fx-rib.v { left: 50%; top: 0; bottom: 0; width: 18px; margin-left: -9px; }
.fx-rib.h { top: 50%; left: 0; right: 0; height: 18px; margin-top: -9px; }
.fx-bow { position: absolute; left: 50%; top: 50%; width: 92%; aspect-ratio: 200 / 180; opacity: 0; filter: drop-shadow(0 3px 3px var(--shadow)); }
.fx-puff, .fx-spark { position: absolute; border-radius: 50%; opacity: 0; }
.fx-puff { background: radial-gradient(circle at 35% 30%, var(--puff-1), var(--puff-2)); }
.fx-spark { background: var(--gold); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media (max-width: 620px) {
  .filters { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 460px) {
  .tag { padding-left: 42px; grid-template-columns: 76px minmax(0, 1fr); gap: 10px 12px; }
  .tag::before { left: 13px; }
  .tag > .thumb { width: 76px; grid-row: auto; }
  .actions { grid-column: 1 / -1; }
  .joy-actions { gap: 8px; }
  .stepper button { width: 32px; }
  .joy-actions .tick { padding-inline: 8px; gap: 6px; margin-left: auto; font-size: .9375rem; white-space: nowrap; }
  .shop { width: 100%; }
}
</style>
</head>

const $ = id => document.getElementById(id);
const store = {
  get(key) { try { return localStorage.getItem(key); } catch { return null; } },
  set(key, value) { try { localStorage.setItem(key, value); } catch {} },
  del(key) { try { localStorage.removeItem(key); } catch {} }
};
const state = {
  token: store.get('wishlist-token'),
  owner: false, items: [], loaded: false, failed: false, tab: 'open', target: null
};
const t = key => T[key] ?? key;
const errorText = err => t('e_' + (err && err.message)) === 'e_' + (err && err.message) ? t('e_server') : t('e_' + err.message);

/* ---------- Data ---------- */

async function call(action, payload = {}) {
  if (!API_URL) return demo(action, { token: state.token, ...payload });
  let res;
  try {
    res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, token: state.token, ...payload })
    });
  } catch { throw new Error('network'); }
  if (!res.ok) throw new Error('network');
  let data;
  try { data = await res.json(); } catch { throw new Error('server'); }
  if (!data.ok) throw new Error(data.error || 'server');
  return data;
}

/* Runs the same actions as Code.gs inside this browser until API_URL is set. */
let demoMemory = null;
function demoLoad() {
  if (demoMemory) return demoMemory;
  try { demoMemory = JSON.parse(store.get('wishlist-demo')); } catch {}
  if (!demoMemory) {
    const day = n => new Date(Date.now() - n * 86400000).toISOString();
    demoMemory = [
      { id: 'd1', name: 'Proutěný košík', specific: false, link: '', price: '', options: '', status: 'open', added: day(9), bought: '' },
      { id: 'd2', name: 'Ukázka: stolní lampa', specific: true, link: 'https://example.com/lamp', price: '1 290 Kč', options: 'matná černá', status: 'open', added: day(6), bought: '' },
      { id: 'd3', name: 'Ukázka: lněná zástěra', specific: true, link: '', price: '640 Kč', options: 'šalvějová, velikost M', status: 'open', added: day(4), bought: '' },
      { id: 'd5', name: 'Ukázka: balíček dobrot', kind: 'joy', joined: 0, specific: false, link: '', price: '', options: '', status: 'open', added: day(3), bought: '', image: '' },
      { id: 'd4', name: 'Ukázka: kniha o zahradě', specific: false, link: '', price: '', options: '', status: 'bought', added: day(20), bought: day(2) }
    ];
  }
  return demoMemory;
}
function demo(action, req) {
  const items = demoLoad();
  const isOwner = req.token === 'demo';
  const find = id => {
    const found = items.find(item => item.id === id);
    if (!found) throw new Error('not_found');
    return found;
  };
  const clean = raw => {
    const name = (raw.name || '').trim();
    if (!name) throw new Error('bad_input');
    const on = raw.specific === true;
    return { name, specific: on, link: on ? normalizeLink(raw.link) : '', price: on ? raw.price.trim() : '', options: on ? raw.options.trim() : '', image: normalizeImage(raw.image) };
  };
  const reply = extra => {
    store.set('wishlist-demo', JSON.stringify(items));
    const owner = extra && extra.token ? true : isOwner;
    return { ok: true, owner, items: owner ? [...items] : items.filter(i => i.status === 'open'), ...extra };
  };
  if (['add', 'update', 'remove', 'restore'].includes(action) && !isOwner) throw new Error('session_expired');
  switch (action) {
    case 'list': return reply();
    case 'login':
      if (req.username !== 'demo' || req.password !== 'demo') throw new Error('bad_login');
      return reply({ token: 'demo' });
    case 'logout': return { ok: true, owner: false, items: items.filter(i => i.status === 'open') };
    case 'buy': {
      const item = find(req.id);
      if (item.kind === 'joy') throw new Error('bad_input');
      if (item.status === 'bought') throw new Error('already_bought');
      item.status = 'bought'; item.bought = new Date().toISOString();
      return reply();
    }
    case 'join': case 'leave': {
      const item = find(req.id);
      if (item.kind !== 'joy') throw new Error('bad_input');
      const quantity = Math.min(100, Math.max(1, Math.floor(Number(req.quantity)) || 1));
      item.joined = Math.max(0, (item.joined || 0) + (action === 'join' ? quantity : -quantity));
      item.bought = item.joined ? new Date().toISOString() : '';
      return reply();
    }
    case 'add':
      items.push({ id: 'd' + Date.now(), ...clean(req.item), kind: req.item.kind === 'joy' ? 'joy' : 'wish', joined: 0, status: 'open', added: new Date().toISOString(), bought: '' });
      return reply();
    case 'update': Object.assign(find(req.id), clean(req.item)); return reply();
    case 'remove': find(req.id); items.splice(items.findIndex(i => i.id === req.id), 1); return reply();
    case 'restore': { const item = find(req.id); item.status = 'open'; item.bought = ''; item.joined = 0; return reply(); }
    default: throw new Error('bad_input');
  }
}

/* Copying an image from Google often gives the picture itself as text instead of a web address. */
const IMAGE_DATA = /^data:image\/(png|jpe?g|gif|webp);base64,[a-z0-9+/=]+$/i;
const MAX_IMAGE_DATA = 45000;
function normalizeImage(value) {
  const text = (value || '').replace(/\s/g, '');
  if (/^data:/i.test(text)) return IMAGE_DATA.test(text) && text.length <= MAX_IMAGE_DATA ? text : '';
  return normalizeLink(value);
}

function normalizeLink(value) {
  let link = (value || '').trim();
  if (!link) return '';
  if (!/^[a-z][a-z0-9+.-]*:/i.test(link)) link = 'https://' + link;
  return /^https?:\/\//i.test(link) ? link : '';
}

/* Public page readers. Used for the demo, and as a backup when a shop refuses the Sheet's request. */
const PAGE_READERS = [
  link => fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(link), { signal: AbortSignal.timeout(15000) }),
  link => fetch('https://api.codetabs.com/v1/proxy/?quest=' + encodeURIComponent(link), { signal: AbortSignal.timeout(15000) }),
  link => fetch('https://r.jina.ai/' + link, { headers: { 'X-Return-Format': 'html' }, signal: AbortSignal.timeout(15000) })
];

function ldImage(node) {
  if (Array.isArray(node)) {
    for (const entry of node) { const found = ldImage(entry); if (found) return found; }
    return '';
  }
  if (!node || typeof node !== 'object') return '';
  const types = [].concat(node['@type'] || []);
  if (node.image && types.some(type => /^(.*[/#])?Product(Group)?$/.test(type))) {
    const first = [].concat(node.image)[0];
    const url = typeof first === 'string' ? first : first && (first.url || first.contentUrl);
    if (url) return url;
  }
  for (const value of Object.values(node)) { const found = ldImage(value); if (found) return found; }
  return '';
}

/* Prefers the shop's product data, because a page's general share image is sometimes just its logo. */
function imageFromHtml(html, pageUrl) {
  const doc = new DOMParser().parseFromString(html || '', 'text/html');
  const meta = name => {
    const node = doc.querySelector(`meta[property="${name}"],meta[name="${name}"]`);
    return node && node.getAttribute('content');
  };
  const structured = [...doc.querySelectorAll('script[type="application/ld+json"]')].map(script => {
    try { return ldImage(JSON.parse(script.textContent)); } catch { return ''; }
  });
  const shareLink = doc.querySelector('link[rel="image_src"]');
  const itemProp = doc.querySelector('meta[itemprop="image"]');
  const candidates = [...structured, meta('og:image:secure_url'), meta('og:image'), meta('twitter:image'), meta('twitter:image:src'),
    shareLink && shareLink.getAttribute('href'), itemProp && itemProp.getAttribute('content')];
  for (const candidate of candidates) {
    if (!candidate || !candidate.trim()) continue;
    try {
      const url = new URL(candidate.trim(), pageUrl);
      if (!/^https?:$/.test(url.protocol) || /\.svg$/i.test(url.pathname)) continue;
      url.protocol = 'https:';
      return url.href;
    } catch {}
  }
  return '';
}

async function viaReader(reader, link) {
  const res = await reader(link);
  if (!res.ok) throw new Error('reader');
  const image = imageFromHtml(await res.text(), link);
  if (!image) throw new Error('reader');
  return image;
}

async function findImage(link) {
  if (API_URL) {
    try {
      const data = await call('readPage', { link });
      const image = imageFromHtml(data.html, link);
      if (image) return image;
    } catch {}
  }
  return Promise.any(PAGE_READERS.map(reader => viaReader(reader, link))).catch(() => '');
}

function apply(data) {
  const hadSession = !!state.token;
  state.items = data.items || [];
  state.owner = !!data.owner;
  state.backend = data.backend;
  if (data.token) { state.token = data.token; store.set('wishlist-token', data.token); }
  if (hadSession && !data.token && !state.owner) {
    state.token = null; store.del('wishlist-token');
    toast(t('e_session_expired'));
  }
  if (!state.owner) state.tab = 'open';
  state.loaded = true; state.failed = false;
  render();
}

let lastSnapshot = '', fxRunning = false;
async function refresh({ quiet = false } = {}) {
  if (quiet && fxRunning) return;
  try {
    const data = await call('list');
    const snapshot = JSON.stringify([data.owner, data.items]);
    if (quiet && snapshot === lastSnapshot) return;
    lastSnapshot = snapshot;
    apply(data);
  } catch (err) {
    if (quiet) return;
    state.failed = true; state.failedText = errorText(err);
    render();
  }
}

/* ---------- Rendering ---------- */

function el(tag, props = {}, ...kids) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (key === 'class') node.className = value;
    else if (key === 'onclick') node.addEventListener('click', value);
    else node[key] = value;
  }
  node.append(...kids.filter(kid => kid !== null && kid !== undefined && kid !== ''));
  return node;
}

function fmtDate(iso) {
  const date = new Date(iso);
  if (isNaN(date)) return '';
  return new Intl.DateTimeFormat('cs-CZ', { day: 'numeric', month: 'numeric', year: 'numeric' }).format(date);
}

/* Every bow on the page is a copy of the one in the header. */
function bowCopy(className) {
  const copy = $('bow').cloneNode(true);
  copy.removeAttribute('id');
  copy.setAttribute('class', className);
  return copy;
}

function setThumb(box, src, alt, onFail) {
  box.replaceChildren();
  box.classList.toggle('empty', !src);
  if (!src) { box.append(bowCopy('thumb-bow')); return; }
  const img = el('img', { src, alt: alt || '', loading: 'lazy', referrerPolicy: 'no-referrer' });
  img.addEventListener('error', () => {
    img.remove();
    box.classList.add('empty');
    box.append(bowCopy('thumb-bow'));
    if (onFail) onFail();
  });
  box.append(img);
}

/* How many of each small happiness this device has added, so they can be taken back. */
function myJoys() {
  try {
    const saved = JSON.parse(store.get('wishlist-joined')) || {};
    return Array.isArray(saved) ? Object.fromEntries(saved.map(id => [id, 1])) : saved;
  } catch { return {}; }
}

const quantities = {};
function stepper(item) {
  const value = () => quantities[item.id] || 1;
  const shown = el('span', { class: 'qty-value', textContent: value() });
  const change = by => {
    quantities[item.id] = Math.min(MAX_QUANTITY, Math.max(1, value() + by));
    sync();
  };
  const less = el('button', { type: 'button', class: 'qty-less', textContent: '−', ariaLabel: t('qtyLess'), onclick: () => change(-1) });
  const more = el('button', { type: 'button', class: 'qty-more', textContent: '+', ariaLabel: t('qtyMore'), onclick: () => change(1) });
  const sync = () => {
    shown.textContent = value();
    less.disabled = value() <= 1;
    more.disabled = value() >= MAX_QUANTITY;
  };
  sync();
  const box = el('div', { class: 'stepper', role: 'group', ariaLabel: t('qty') }, less, shown, more);
  return box;
}

function card(item, archive) {
  const joy = item.kind === 'joy';
  const bought = item.status === 'bought' || archive;
  const safeLink = item.specific && /^https?:\/\//i.test(item.link) ? item.link : '';
  const box = safeLink
    ? el('a', { class: 'thumb', href: safeLink, target: '_blank', rel: 'noopener noreferrer', tabIndex: -1 })
    : el('div', { class: 'thumb' });
  setThumb(box, item.image, item.name);

  const main = el('div', { class: 'tag-main' },
    el('div', { class: 'tag-head' },
      el('div', { class: 'tag-title' },
        el('h2', { textContent: item.name }),
        !item.specific && !joy ? el('p', { class: 'anykind', textContent: t('anyKind') }) : null),
      joy ? el('div', { class: 'price', textContent: t('joyPrice') })
        : item.specific && item.price ? el('div', { class: 'price', textContent: item.price }) : null));
  if (item.specific && item.options) {
    main.append(el('p', { class: 'options' }, el('b', { textContent: t('optionsLabel') + ' ' }), item.options));
  }
  if (joy && item.joined > 0 && !archive) main.append(el('p', { class: 'options', textContent: `${t('joinCount')} ${item.joined}×` }));
  const mine = joy && !archive ? myJoys()[item.id] || 0 : 0;
  if (mine) main.append(el('button', { type: 'button', class: 'undo', textContent: `${t('undo')} (${mine})`, onclick: e => undoJoy(item, e.currentTarget) }));
  const tag = el('article', { class: 'tag' }, box, main);

  const link = safeLink
    ? el('a', { class: 'shop', href: safeLink, target: '_blank', rel: 'noopener noreferrer', textContent: t('shop') + ' ↗' })
    : null;

  if (bought) {
    main.append(el('div', { class: 'stamp', textContent: joy
      ? `${t('joinCount')} ${item.joined}× · ${fmtDate(item.bought)}`
      : `${t('boughtOn')} ${fmtDate(item.bought)}` }));
    if (link) main.append(link);
  } else {
    tag.append(el('div', { class: joy ? 'actions joy-actions' : 'actions' }, link, joy ? stepper(item) : null,
      el('button', { type: 'button', class: 'btn tick', textContent: t('tick'),
        onclick: e => joy ? confirmJoy(item, e.currentTarget) : openBuy(item) })));
  }

  if (state.owner) {
    tag.append(el('div', { class: 'owner-actions' },
      bought
        ? el('button', { type: 'button', class: 'btn quiet', textContent: t(joy ? 'restoreJoy' : 'restore'), onclick: e => restore(item, e.currentTarget) })
        : el('button', { type: 'button', class: 'btn quiet', textContent: t('edit'), onclick: () => openForm(item) }),
      el('button', { type: 'button', class: 'btn quiet', textContent: t('remove'), onclick: () => openDelete(item) })));
  }
  const row = el('li', { class: 'item' }, tag);
  row.dataset.id = item.id;
  return row;
}

/* Reads a number from a price typed as text: 1 290 Kč, 1.290,50 Kč, 690,-, od 500 Kč. */
function parsePrice(text) {
  const match = String(text || '').replace(/[\s\u00a0\u202f]/g, '').match(/\d[\d.,]*/);
  if (!match) return null;
  const number = match[0].replace(/[.,]+$/, '').replace(/[.,](?=\d{3}(?:[.,]|$))/g, '').replace(',', '.');
  const value = parseFloat(number);
  return isNaN(value) ? null : value;
}
const itemPrice = item => item.specific ? parsePrice(item.price) : null;

function filterValues() {
  let low = parsePrice($('priceMin').value), high = parsePrice($('priceMax').value);
  if (low !== null && high !== null && low > high) [low, high] = [high, low];
  return { sort: $('sortBy').value, type: $('typeFilter').value, low, high };
}

function applyFilters(items) {
  const { sort, type, low, high } = filterValues();
  const kept = items.filter(item => {
    if (type && (type === 'specific') !== !!item.specific) return false;
    if (low === null && high === null) return true;
    const price = itemPrice(item);
    return price !== null && (low === null || price >= low) && (high === null || price <= high);
  });
  if (!sort) return kept;
  const direction = sort === 'asc' ? 1 : -1;
  return kept.sort((a, b) => {
    const priceA = itemPrice(a), priceB = itemPrice(b);
    if (priceA === null || priceB === null) return (priceA === null) - (priceB === null);
    return (priceA - priceB) * direction;
  });
}

function statusBlock(title, body, withRetry) {
  return el('div', {},
    el('h2', { textContent: title }),
    body ? el('p', { textContent: body }) : null,
    withRetry ? el('button', { type: 'button', class: 'btn', textContent: t('retry'), onclick: () => { state.failed = false; render(); refresh(); } }) : null);
}

function render() {
  document.title = LIST_TITLE.join(' ');
  $('title').replaceChildren(...LIST_TITLE.map(line => el('span', { class: 'title-line', textContent: line })));
  $('lede').textContent = t('lede');
  $('demoNotice').textContent = t('demo');
  $('demoNotice').hidden = !!API_URL;
  $('oldBackend').textContent = t('oldBackend');
  $('oldBackend').hidden = !(API_URL && state.owner && state.backend !== 3);

  document.querySelectorAll('[data-t]').forEach(node => { node.textContent = t(node.dataset.t); });
  document.querySelectorAll('[data-ph]').forEach(node => { node.placeholder = t(node.dataset.ph); });

  const open = state.items.filter(item => item.kind !== 'joy' && item.status !== 'bought');
  const joys = state.items.filter(item => item.kind === 'joy');
  const bought = state.items.filter(item => item.status === 'bought' || (item.kind === 'joy' && item.joined > 0))
    .sort((a, b) => String(b.bought).localeCompare(String(a.bought)));

  $('ownerBar').hidden = !state.owner;
  $('tabOpen').textContent = `${t('tabOpen')} (${open.length + joys.length})`;
  $('tabBought').textContent = `${t('tabBought')} (${bought.length})`;
  $('tabOpen').setAttribute('aria-selected', String(state.tab === 'open'));
  $('tabBought').setAttribute('aria-selected', String(state.tab === 'bought'));
  $('addBtn').textContent = t('add');
  $('signInBtn').textContent = t('signIn');
  $('signOutBtn').textContent = t('signOut');
  $('signInBtn').hidden = state.owner;
  $('signOutBtn').hidden = !state.owner;

  const onBoughtTab = state.tab === 'bought';
  const shown = onBoughtTab ? bought : applyFilters(open);
  const filtering = !!($('sortBy').value || $('typeFilter').value || $('priceMin').value.trim() || $('priceMax').value.trim());
  $('filters').hidden = onBoughtTab || !open.length;
  $('filtersFoot').hidden = !filtering;
  $('filterCount').textContent = `Zobrazeno ${shown.length} z ${open.length}`;
  $('list').replaceChildren(...shown.map(item => card(item, onBoughtTab)));
  $('joyList').replaceChildren(...joys.map(item => card(item)));
  $('joys').hidden = onBoughtTab || !state.loaded || (!joys.length && !state.owner);
  $('addJoyBtn').hidden = !state.owner;

  let block = null;
  if (state.failed) block = statusBlock(state.failedText, '', true);
  else if (!state.loaded) block = el('p', { textContent: t('loading') });
  else if (!shown.length && !onBoughtTab && open.length) block = statusBlock(t('noMatch'), t('noMatchBody'));
  else if (!shown.length && state.tab === 'bought') block = statusBlock(t('emptyBought'), t('emptyBoughtBody'));
  else if (!shown.length && state.owner) block = statusBlock(t('emptyOwner'), t('emptyOwnerBody'));
  else if (!shown.length && joys.length) block = statusBlock(t('emptyWishes'), t('emptyWishesBody'));
  else if (!shown.length) block = statusBlock(t('emptyGuest'), t('emptyGuestBody'));
  $('status').replaceChildren(...(block ? [block] : []));
}

let toastTimer;
function toast(message) {
  $('toast').textContent = message;
  $('toast').hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $('toast').hidden = true; }, 4000);
}

function showError(id, message) {
  $(id).textContent = message || '';
  $(id).hidden = !message;
}

async function busy(button, work) {
  button.disabled = true;
  try { return await work(); } finally { button.disabled = false; }
}

/* ---------- Gift wrapping ---------- */

const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
const play = (node, frames, options) =>
  node.animate(frames, { fill: 'both', easing: 'cubic-bezier(.3, .7, .3, 1)', ...options }).finished.catch(() => {});

async function giftSequence(row, layer) {
  const rect = row.getBoundingClientRect();
  const side = Math.round(Math.max(110, Math.min(150, rect.height, rect.width)));
  const boxLeft = rect.left + (rect.width - side) / 2, boxTop = rect.top + (rect.height - side) / 2;

  const place = (left, top, width, height) => ({ left: left + 'px', top: top + 'px', width: width + 'px', height: height + 'px' });
  const box = el('div', { class: 'fx-box' });
  Object.assign(box.style, place(rect.left, rect.top, rect.width, rect.height));
  const clone = row.firstElementChild.cloneNode(true);
  const flapTop = el('div', { class: 'fx-flap top fx-paper' });
  const flapBottom = el('div', { class: 'fx-flap bottom fx-paper' });
  const ribV = el('div', { class: 'fx-rib v' });
  const ribH = el('div', { class: 'fx-rib h' });
  const bow = bowCopy('fx-bow');
  box.append(clone, flapTop, flapBottom, ribV, ribH, bow);
  layer.append(box);
  document.body.append(layer);
  row.style.visibility = 'hidden';

  // Paper folds over the card from the top and the bottom.
  const fold = from => [{ opacity: 1, transform: `perspective(900px) rotateX(${from}deg)` }, { opacity: 1, transform: 'perspective(900px) rotateX(0deg)' }];
  await Promise.all([
    play(flapTop, fold(-100), { duration: 420 }),
    play(flapBottom, fold(100), { duration: 420, delay: 140 })
  ]);

  // The wrapped card closes into a box.
  box.classList.add('fx-paper');
  clone.remove(); flapTop.remove(); flapBottom.remove();
  await play(box, [
    { ...place(rect.left, rect.top, rect.width, rect.height), borderRadius: '0px' },
    { ...place(boxLeft, boxTop, side, side), borderRadius: '8px' }
  ], { duration: 380 });

  // Ribbon, then the bow.
  await Promise.all([
    play(ribV, [{ transform: 'scaleY(0)' }, { transform: 'scaleY(1)' }], { duration: 240 }),
    play(ribH, [{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], { duration: 240, delay: 80 })
  ]);
  await play(bow, [
    { opacity: 0, transform: 'translate(-50%, -50%) scale(.2) rotate(-16deg)' },
    { opacity: 1, offset: .7, transform: 'translate(-50%, -50%) scale(1.14) rotate(4deg)' },
    { opacity: 1, transform: 'translate(-50%, -50%) scale(1) rotate(0deg)' }
  ], { duration: 360 });
  await sleep(220);

  // Poof.
  const centerX = boxLeft + side / 2, centerY = boxTop + side / 2;
  const burst = [];
  for (let i = 0; i < 14; i++) {
    const angle = i / 14 * Math.PI * 2, reach = side * (.5 + (i * 7 % 5) * .13), size = side * (.34 + (i * 3 % 4) * .1);
    const puff = el('div', { class: 'fx-puff' });
    Object.assign(puff.style, place(centerX - size / 2, centerY - size / 2, size, size));
    layer.append(puff);
    const move = `translate(${Math.cos(angle) * reach}px, ${Math.sin(angle) * reach}px)`;
    burst.push(play(puff, [
      { opacity: .95, transform: 'scale(.3)' },
      { opacity: .9, offset: .35, transform: `${move} scale(1)` },
      { opacity: 0, transform: `${move} scale(1.5)` }
    ], { duration: 620, delay: i % 3 * 30 }));
  }
  for (let i = 0; i < 10; i++) {
    const angle = (i + .5) / 10 * Math.PI * 2, reach = side * (1 + (i * 3 % 4) * .18);
    const spark = el('div', { class: 'fx-spark' });
    Object.assign(spark.style, place(centerX - 4, centerY - 4, 8, 8));
    layer.append(spark);
    burst.push(play(spark, [
      { opacity: 1, transform: 'translate(0, 0) scale(1)' },
      { opacity: 0, transform: `translate(${Math.cos(angle) * reach}px, ${Math.sin(angle) * reach}px) scale(.3)` }
    ], { duration: 560 }));
  }
  burst.push(play(box, [
    { opacity: 1, transform: 'scale(1)' },
    { opacity: 1, offset: .4, transform: 'scale(1.14)' },
    { opacity: 0, transform: 'scale(.15)' }
  ], { duration: 280, composite: 'replace' }));
  await Promise.all(burst);

  // The list closes the gap.
  await play(row, [
    { height: rect.height + 'px', marginBottom: '0px' },
    { height: '0px', marginBottom: '-16px' }
  ], { duration: 240 });
}

/* Decoration only: the purchase is already saved, and a stuck animation can never hold the list up. */
async function wrapGift(id) {
  const row = [...$('list').children].find(node => node.dataset.id === id);
  if (!row || !row.animate || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const layer = el('div', { class: 'fx-layer', ariaHidden: 'true' });
  fxRunning = true;
  try {
    await Promise.race([giftSequence(row, layer), sleep(4500)]);
  } catch {
  } finally {
    layer.remove();
    fxRunning = false;
  }
}

/* ---------- Actions ---------- */

function openBuy(item) {
  state.target = item;
  $('buyName').textContent = item.name;
  showError('buyError');
  $('buyDlg').showModal();
}

$('buyConfirm').addEventListener('click', e => busy(e.currentTarget, async () => {
  try {
    const data = await call('buy', { id: state.target.id });
    $('buyDlg').close();
    await wrapGift(state.target.id);
    apply(data);
    toast(t('tBought'));
  } catch (err) {
    if (err.message === 'already_bought' || err.message === 'not_found') {
      $('buyDlg').close();
      toast(errorText(err));
      refresh();
    } else showError('buyError', errorText(err));
  }
}));

function openDelete(item) {
  state.target = item;
  $('delName').textContent = item.name;
  showError('delError');
  $('delDlg').showModal();
}

$('delConfirm').addEventListener('click', e => busy(e.currentTarget, async () => {
  try {
    apply(await call('remove', { id: state.target.id }));
    $('delDlg').close();
    toast(t('tRemoved'));
  } catch (err) {
    showError('delError', errorText(err));
    if (err.message === 'session_expired') expire();
  }
}));

async function restore(item, button) {
  await busy(button, async () => {
    try { apply(await call('restore', { id: item.id })); toast(t(item.kind === 'joy' ? 'tJoyReset' : 'tRestored')); }
    catch (err) { toast(errorText(err)); if (err.message === 'session_expired') expire(); }
  });
}

async function confirmJoy(item, button) {
  await busy(button, async () => {
    const quantity = quantities[item.id] || 1;
    try {
      const data = await call('join', { id: item.id, quantity });
      const mine = myJoys();
      mine[item.id] = (mine[item.id] || 0) + quantity;
      store.set('wishlist-joined', JSON.stringify(mine));
      delete quantities[item.id];
      apply(data);
      toast(t('tJoined'));
    } catch (err) { toast(errorText(err)); }
  });
}

async function undoJoy(item, button) {
  await busy(button, async () => {
    const mine = myJoys();
    try {
      const data = await call('leave', { id: item.id, quantity: mine[item.id] || 1 });
      delete mine[item.id];
      store.set('wishlist-joined', JSON.stringify(mine));
      apply(data);
      toast(t('tLeft'));
    } catch (err) { toast(errorText(err)); }
  });
}

function expire() {
  state.token = null; state.owner = false; state.tab = 'open';
  store.del('wishlist-token');
  refresh();
}

function syncDetails() {
  const joy = state.formKind === 'joy', specific = $('fSpecific').checked && !joy;
  $('fSpecificRow').hidden = joy;
  $('fDetails').hidden = !specific;
  $('imgFind').hidden = !specific;
}
const imageHint = () => $('fSpecific').checked ? 'imgIdle' : 'imgIdleIdea';
$('fSpecific').addEventListener('change', () => {
  syncDetails();
  if ($('fSpecific').checked) lookup();
  if (!$('fImage').value) $('imgStatus').textContent = t(imageHint());
});

let lookupRun = 0, lookupPending = null, lookedUp = '', imageManual = false;

function showFormImage(src, statusKey) {
  $('imgStatus').textContent = t(statusKey);
  setThumb($('fThumb'), src, $('fName').value, () => {
    if (!imageManual) $('fImage').value = '';
    $('imgStatus').textContent = t('imgBroken');
    // A link that isn't a picture may be a page with one on it.
    if (imageManual) setTimeout(() => {
      if (normalizeImage($('fImage').value) === src && !/^data:/i.test(src) && !lookupPending) imageFromPage(src);
    }, 500);
  });
}

/* Waits for the preview, so a link that isn't a picture is caught before saving. */
function thumbLoaded() {
  const img = $('fThumb').querySelector('img');
  if (!img) return Promise.resolve(false);
  if (img.complete) return Promise.resolve(img.naturalWidth > 0);
  return new Promise(resolve => {
    img.addEventListener('load', () => resolve(true), { once: true });
    img.addEventListener('error', () => resolve(false), { once: true });
    setTimeout(() => resolve(true), 6000);
  });
}

function imageFromPage(page) {
  const run = ++lookupRun;
  $('imgStatus').textContent = t('imgSearching');
  lookupPending = findImage(page).then(image => {
    if (run !== lookupRun) return;
    lookupPending = null;
    if (!image) { $('imgStatus').textContent = t('imgBroken'); return; }
    $('fImage').value = image;
    showFormImage(image, 'imgFound');
  });
  return lookupPending;
}

function lookup(force) {
  const link = normalizeLink($('fLink').value);
  if (force === true) imageManual = false;
  if (imageManual || !$('fSpecific').checked) return lookupPending;
  if (!link) {
    lookupRun++; lookedUp = ''; lookupPending = null;
    $('fImage').value = '';
    showFormImage('', imageHint());
    return null;
  }
  if (link === lookedUp && force !== true) return lookupPending;
  lookedUp = link;
  const run = ++lookupRun;
  $('imgFind').disabled = true;
  $('fImage').value = '';
  showFormImage('', 'imgSearching');
  lookupPending = findImage(link).then(image => {
    if (run !== lookupRun) return;
    $('imgFind').disabled = false;
    lookupPending = null;
    if (imageManual) return;
    $('fImage').value = image;
    showFormImage(image, image ? 'imgFound' : 'imgNone');
  });
  return lookupPending;
}

$('fLink').addEventListener('change', () => lookup());
$('fLink').addEventListener('paste', () => setTimeout(() => lookup(), 0));
$('imgFind').addEventListener('click', () => lookup(true));
$('fImage').addEventListener('input', () => {
  const src = normalizeImage($('fImage').value);
  showError('formError');
  imageManual = !!src;
  lookupRun++;
  lookupPending = null;
  $('imgFind').disabled = false;
  showFormImage(src, src ? '' : /^\s*data:/i.test($('fImage').value) ? 'imgTooBig' : imageHint());
});

function openForm(item, kind) {
  state.target = item || null;
  state.formKind = item ? (item.kind || 'wish') : (kind || 'wish');
  const joy = state.formKind === 'joy';
  $('formTitle').textContent = t(joy ? (item ? 'editJoy' : 'newJoy') : (item ? 'editWish' : 'newWish'));
  $('fNameLabel').textContent = t(joy ? 'joyName' : 'wishName');
  $('fName').value = item ? item.name : '';
  $('fSpecific').checked = !!(item && item.specific);
  $('fLink').value = item ? item.link : '';
  $('fPrice').value = item ? item.price : '';
  $('fOptions').value = item ? item.options : '';
  $('fImage').value = (item && item.image) || '';
  imageManual = !!(item && item.image && !(item.specific && item.link)); lookupRun++; lookupPending = null;
  lookedUp = (item && item.image) ? item.link : '';
  $('imgFind').disabled = false;
  syncDetails();
  showFormImage($('fImage').value, imageHint());
  showError('formError');
  $('formDlg').showModal();
  if (item && item.specific && item.link && !item.image) lookup();
}
$('addBtn').addEventListener('click', () => openForm(null));
$('addJoyBtn').addEventListener('click', () => openForm(null, 'joy'));

$('itemForm').addEventListener('submit', e => {
  e.preventDefault();
  busy($('formSave'), async () => {
    await lookup();
    if (imageManual && !(await thumbLoaded())) {
      const page = normalizeImage($('fImage').value);
      if (page && !/^data:/i.test(page)) await (lookupPending || imageFromPage(page));
    }
    const loaded = await thumbLoaded();
    if ($('fImage').value.trim() && !loaded) {
      showError('formError', t('imgNotSaved'));
      return;
    }
    const specific = $('fSpecific').checked && state.formKind !== 'joy';
    const item = {
      name: $('fName').value,
      kind: state.formKind,
      specific,
      link: specific ? normalizeLink($('fLink').value) : '',
      price: specific ? $('fPrice').value : '',
      options: specific ? $('fOptions').value : '',
      image: normalizeImage($('fImage').value)
    };
    try {
      const data = state.target
        ? await call('update', { id: state.target.id, item })
        : await call('add', { item });
      apply(data);
      $('formDlg').close();
      toast(t('tSaved'));
    } catch (err) {
      showError('formError', errorText(err));
      if (err.message === 'session_expired') { $('formDlg').close(); toast(errorText(err)); expire(); }
    }
  });
});

$('signInBtn').addEventListener('click', () => {
  showError('loginError');
  $('lPass').value = '';
  $('loginDlg').showModal();
});

$('loginForm').addEventListener('submit', e => {
  e.preventDefault();
  busy($('loginSubmit'), async () => {
    try {
      state.token = null;
      apply(await call('login', { username: $('lUser').value.trim(), password: $('lPass').value }));
      $('lPass').value = '';
      $('loginDlg').close();
    } catch (err) { showError('loginError', errorText(err)); }
  });
});

$('signOutBtn').addEventListener('click', e => busy(e.currentTarget, async () => {
  try { await call('logout'); } catch {}
  state.token = null; state.owner = false; state.tab = 'open';
  store.del('wishlist-token');
  await refresh();
  toast(t('tSignedOut'));
}));

document.querySelectorAll('[data-close]').forEach(button =>
  button.addEventListener('click', () => button.closest('dialog').close()));
['sortBy', 'typeFilter', 'priceMin', 'priceMax'].forEach(id => $(id).addEventListener('input', render));
$('filterReset').addEventListener('click', () => {
  ['sortBy', 'typeFilter', 'priceMin', 'priceMax'].forEach(id => { $(id).value = ''; });
  render();
});
$('tabOpen').addEventListener('click', () => { state.tab = 'open'; render(); });
$('tabBought').addEventListener('click', () => { state.tab = 'bought'; render(); });

/* Keeps the list current while it stays open, so bought items vanish for other guests too. */
const anyDialogOpen = () => document.querySelector('dialog[open]') !== null;
setInterval(() => { if (!document.hidden && !anyDialogOpen()) refresh({ quiet: true }); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && !anyDialogOpen()) refresh({ quiet: true }); });

render();
refresh();
</script>
</body>
</html>
